services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: faraid
      POSTGRES_PASSWORD: faraid_dev_password
      POSTGRES_DB: faraid_ai
    ports:
      - "5432:5432"
    volumes:
      - faraid_postgres:/var/lib/postgresql/data
volumes:
  faraid_postgres:
